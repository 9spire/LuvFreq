<a id="contact"></a>
<div class="full dark contact-section">
  <div class="row">
    <div class="large-8 columns large-centered">
      {% include section-title.html small_title="contact" title="Contact" %}
      <div class="contact-section__details centered-text">
        <p class="contact-section__item">
          <span class="contact-section__label">Location</span>
          Portland, Oregon
        </p>
        <p class="contact-section__item">
          <span class="contact-section__label">Email</span>
          <a href="mailto:{{ site.email }}">{{ site.email }}</a>
        </p>
      </div>
      <p class="centered-text contact-section__listen">Listen &amp; connect</p>
      <ul class="site-socials site-socials--centered">
        {% for item in site.data.social %}
        <li>
          <a href="{{ item.url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ item.label }}">
            <i class="fa {{ item.icon }}" aria-hidden="true"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
        {% endfor %}
      </ul>
      <p class="centered-text contact-section__copy">
        &copy;{{ site.time | date: "%Y" }} Luv Freq. All rights reserved.
      </p>
    </div>
  </div>
</div>
