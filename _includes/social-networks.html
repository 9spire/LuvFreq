<div class="full parallax social-networks social-networks--slim" style="background-image: url({{ "/assets/images/@stock/socials-bg.jpg" | relative_url }})">
  <div class="two spacing"></div>
  <div class="row">
    <div class="large-8 columns large-centered">
      <p class="centered-text social-networks__intro">Listen &amp; connect</p>
      <ul class="site-socials site-socials--centered">
        {% for item in site.data.social %}
        <li>
          <a href="{{ item.url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ item.label }}">
            <i class="fa {{ item.icon }}" aria-hidden="true"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>
  <div class="two spacing"></div>
</div>
